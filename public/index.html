  <title>dsh-crash-collect</title>
  <style>
    body { max-width: 640px; margin: 64px auto; padding: 0 16px; font: 16px/1.7 -apple-system, "PingFang SC", sans-serif; color: #222; }

<body>
  <h1>dsh-crash-collect</h1>
  <p>dsh-why 崩溃案例上报收集端点（opt-in，白名单脱敏）。数据经聚合后发布为
    <a href="https://dsh-insights.com/data/">dsh-insights 开放数据</a>的一部分。</p>
  <ul>
    <li><code>POST /v1/report</code> — 上报一条失败案例（仅白名单字段）</li>
    <li><code>GET /v1/stats</code> — 公开统计</li>
  </ul>
  <p>只收集错误签名、shell 版本、插件名与版本、错误码等结构化字段；
    不收集用户消息、工具参数、文件路径或任何文本内容。</p>
</body>
</html>
